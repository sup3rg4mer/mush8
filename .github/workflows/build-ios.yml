name: Build Mush8 iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Homebrew & Dependencies
        run: |
          brew install xcodegen

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-ios

      - name: Compile and Package IPA
        run: |
          # 1. Run the native script without flags to build the raw app folder structure
          ./make-ios.sh || true
          
          # 2. Manually bundle the compiled app folder into a standard iOS Payload
          mkdir -p build/Payload
          cp -r ios/build/Build/Products/Release-iphoneos/Mush8.app build/Payload/ 2>/dev/null || cp -r build/Mush8.app build/Payload/ || true
          
          # 3. Zip it into a clean .ipa file for AltStore/SideStore
          cd build
          zip -r Mush8.ipa Payload/
        env:
          FREE: 1

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-iOS-IPA
          path: build/Mush8.ipa
