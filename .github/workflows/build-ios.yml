name: Build Mush8 iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Homebrew & Dependencies
        run: |
          brew install xcodegen

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-ios

      - name: Build and Force IPA Packaging
        run: |
          # Generate Xcode project via xcodegen
          xcodegen generate
          
          # Build raw binary structure skipping code signature verification completely
          xcodebuild -project Mush8.xcodeproj -scheme Mush8-iOS -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO clean build
          
          # Manually structure a standard iOS Payload folder to create an IPA
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/Mush8.app build/Payload/
          cd build && zip -r Mush8.ipa Payload/
        env:
          FREE: 1

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-iOS-IPA
          path: build/Mush8.ipa
